<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">repocli：仓库级的理解与操作能力</title>
<desc id="desc">开发者和 coding agent 通过 repocli 分析仓库、管理工作区、执行验证及 Git/Forge 操作。repocli 访问 Remote 与 Local 的事实，并读写本机 RepoKit Home 的配置、身份关联和执行记录。Home 关联远端对象与本地工作区，源码和依赖保留在 checkout。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
<marker id="link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a78bfa"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17243b}.title{font-size:29px;font-weight:700}.heading{font-size:23px;font-weight:650}.body{font-size:19px}.small{font-size:16px;fill:#57677e}.command{font-family:'SFMono-Regular',Consolas,monospace;font-size:16px;fill:#315477}.flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.association{fill:none;stroke:#a78bfa;stroke-width:2;stroke-dasharray:5 5;marker-start:url(#link);marker-end:url(#link)}</style>
</defs>
<rect x="0" y="0" width="1200" height="900" rx="24" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="40" y="54" class="title" >repocli：仓库级的理解与操作能力</text>
<text x="40" y="85" class="body" >理解项目结构与工程约定，将常见开发动作组织为统一入口</text>
<rect x="300" y="116" width="600" height="76" rx="16" fill="#172b4d" stroke="none" stroke-width="2"/>
<text x="600" y="147" class="heading" text-anchor="middle" style="fill:#fff">开发者 / Coding agent</text>
<text x="600" y="174" class="small" text-anchor="middle" style="fill:#c9d7ea">决定任务、操作目标与范围</text>
<path d="M520 192 V244" class="flow"/>
<path d="M680 244 V192" class="flow"/>
<text x="504" y="222" class="small" text-anchor="end">调用命令</text>
<text x="696" y="222" class="small" >结果 · 诊断 · 耗时</text>
<rect x="40" y="250" width="1120" height="196" rx="18" fill="#fff" stroke="#b9cce3" stroke-width="2"/>
<text x="64" y="287" class="heading" >repocli</text>
<text x="162" y="286" class="body" >统一 CLI 入口 · 由 RepoKit 提供仓库能力</text>
<path d="M64 307 H1136" stroke="#e4ebf3"/>
<rect x="60" y="323" width="255" height="102" rx="12" fill="#eff6ff" stroke="none" stroke-width="2"/>
<text x="78" y="350" class="body" font-weight="650">理解与分析</text>
<text x="78" y="380" class="command" >inspect · diff · impact</text>
<text x="78" y="406" class="command" >code dead</text>
<rect x="335" y="323" width="255" height="102" rx="12" fill="#ecf8f4" stroke="none" stroke-width="2"/>
<text x="353" y="350" class="body" font-weight="650">工作区与资源</text>
<text x="353" y="380" class="command" >worktree · depot</text>
<text x="353" y="406" class="command" >clean</text>
<rect x="610" y="323" width="255" height="102" rx="12" fill="#f3f0ff" stroke="none" stroke-width="2"/>
<text x="628" y="350" class="body" font-weight="650">验证与复用</text>
<text x="628" y="380" class="command" >format · lint · test</text>
<text x="628" y="406" class="command" >validate · history</text>
<rect x="885" y="323" width="255" height="102" rx="12" fill="#fff5e8" stroke="none" stroke-width="2"/>
<text x="903" y="350" class="body" font-weight="650">Git / Forge 操作</text>
<text x="903" y="380" class="command" >git · pr · pr comment</text>
<text x="903" y="406" class="command" >release</text>
<path d="M210 446 V514" class="flow"/>
<text x="225" y="485" class="small" >查询 / 操作</text>
<path d="M600 446 V514" class="flow"/>
<text x="615" y="485" class="small" >读取 / 记录</text>
<path d="M990 446 V514" class="flow"/>
<text x="1005" y="485" class="small" >分析 / 执行</text>
<rect x="40" y="520" width="340" height="270" rx="16" fill="#fff" stroke="#bbd5f6" stroke-width="2"/>
<rect x="40" y="520" width="340" height="7" rx="3" fill="#5b9ce6" stroke="none" stroke-width="2"/>
<text x="64" y="560" class="heading" >Remote</text>
<text x="64" y="588" class="small" >Git remote / GitHub / GitLab</text>
<path d="M64 608 H356" stroke="#e4ebf3"/>
<text x="64" y="641" class="body" >Repository · 远端分支 / Tag</text>
<text x="64" y="676" class="body" >PR / MR · Comment · Release</text>
<text x="64" y="711" class="body" >远端状态与权限</text>
<text x="64" y="762" class="small" >远端事实由 Git remote / Forge 提供</text>
<rect x="430" y="520" width="340" height="270" rx="16" fill="#faf7ff" stroke="#c9b8ed" stroke-width="2"/>
<rect x="430" y="520" width="340" height="7" rx="3" fill="#a78bda" stroke="none" stroke-width="2"/>
<text x="454" y="560" class="heading" >RepoKit Home</text>
<text x="454" y="588" class="small" >本机共享目录 · ~/.repokit</text>
<path d="M454 608 H746" stroke="#e4ebf3"/>
<text x="454" y="641" class="body" >访问配置 · 资源保留策略</text>
<text x="454" y="676" class="body" >仓库登记 · 身份 / 位置关联</text>
<text x="454" y="711" class="body" >观测缓存 · 验证历史与执行记录</text>
<text x="454" y="762" class="small" >关联远端对象与本地工作区</text>
<rect x="820" y="520" width="340" height="270" rx="16" fill="#fff" stroke="#aed8c9" stroke-width="2"/>
<rect x="820" y="520" width="340" height="7" rx="3" fill="#57af93" stroke="none" stroke-width="2"/>
<text x="844" y="560" class="heading" >Local</text>
<text x="844" y="588" class="small" >本机各处的 clone / checkout</text>
<path d="M844 608 H1136" stroke="#e4ebf3"/>
<text x="844" y="641" class="body" >Clone · Branch · Worktree</text>
<text x="844" y="676" class="body" >Component · 源码 · Makefile</text>
<text x="844" y="711" class="body" >依赖环境 · 构建产物</text>
<text x="844" y="762" class="small" >Git 状态、源码与环境保留在本地</text>
<path d="M384 675 H426" class="association"/>
<path d="M774 675 H816" class="association"/>
<path d="M42 827 H90" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 5"/>
<text x="103" y="833" class="small" >身份与位置关联：Repository / PR ↔ Clone / Branch / Worktree</text>
<text x="40" y="871" class="body" >Remote 与 Local 提供事实；Home 保存关联与记录；repocli 组合操作并返回结果。</text>
</svg>
